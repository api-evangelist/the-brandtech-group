  reason: no-developer-program
  detail: >-
    The Brandtech Group sells agency services and one end-user SaaS product
    (Pencil) and runs no developer program at all — trypencil.com/openapi.json
    404s, app.trypencil.com, pro.trypencil.com and cn.trypencil.com answer every
    spec, GraphQL and /.well-known path with the same 3,480-byte React shell,
    and the one production API host in the group, api.acorn-i.com, is an AWS API
    Gateway that returns "Missing Authentication Token" on its root with no
    documentation, sign-up or key issuance published anywhere.
