aid: the-brandtech-group
name: The Brandtech Group
description: 'The Brandtech Group is a privately held marketing and marketing-technology
  holding group founded in 2015 by former Havas CEO David Jones as You & Mr Jones and
  renamed in 2022. It positions itself as a generative-AI marketing group and operates
  a portfolio of wholly owned brands rather than a single product: Oliver (in-house
  agency), Jellyfish (digital and performance marketing), Pencil (a generative-AI
  creative platform for ad copy, image and video), Acorn-i (Amazon and ecommerce
  retail-media analytics), fifty-five and DP6 (data and marketing science),
  Collectively (creator and influencer marketing), Mobkoi, Gravity Road, Mofilm and
  Brandtech Consulting. Its customer-facing software surface is Pencil, a SaaS
  platform that orchestrates third-party generative-AI models (OpenAI, Google, Adobe,
  Runway, Bria) and pushes creative into Meta, TikTok, YouTube, Google Display, DV360
  and LinkedIn. The group publishes no developer portal, no OpenAPI or other
  machine-readable contract, and no public API keys or SDKs; integration is delivered
  through the products themselves and through partner connectors.'
